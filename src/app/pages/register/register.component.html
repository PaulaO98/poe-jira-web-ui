<section class="auth">
  <div class="auth__wrap">
    <app-ui-card>
      <header class="auth__header">
        <h1 class="auth__title">Crear cuenta</h1>
        <p class="auth__subtitle">Se creará tu workspace y proyecto demo automáticamente.</p>
      </header>

      <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()">
        <app-ui-form-field label="Nombre" [error]="errorName">
          <input class="input" type="text" formControlName="name" placeholder="Tu nombre" />
        </app-ui-form-field>

        <app-ui-form-field label="Email" [error]="errorEmail">
          <input class="input" type="email" formControlName="email" placeholder="tu@email.com" />
        </app-ui-form-field>

        <app-ui-form-field label="Password" hint="Mínimo 6 caracteres" [error]="errorPassword">
          <input class="input" type="password" formControlName="password" placeholder="********" />
        </app-ui-form-field>

        <div class="auth__actions">
          <app-ui-button type="submit" [loading]="loading">Crear cuenta</app-ui-button>
          <a class="auth__link" routerLink="/login">Ya tengo cuenta</a>
        </div>

  <p class="auth__error" *ngIf="error">{{ error }}</p>
      </form>
    </app-ui-card>
  </div>
</section>
